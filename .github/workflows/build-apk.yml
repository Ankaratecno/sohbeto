name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Bun kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bağımlılıkları kur
        run: bun install

      - name: Web (mobil) çıktısını üret
        run: bun run build:mobile

      - name: JDK 21 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      - name: Android platformunu ekle ve senkronize et
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Uygulama ikonlarını ve splash görsellerini üret
        run: |
          npx --yes @capacitor/assets@3 generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor '#0e1621' \
            --iconBackgroundColorDark '#0e1621' \
            --splashBackgroundColor '#0e1621' \
            --splashBackgroundColorDark '#0e1621'


      - name: Android izinlerini ve native eklentiyi uygula
        run: |
          chmod +x android-patch/patch-android.sh
          ./android-patch/patch-android.sh

      - name: Sürüm bilgisini yaz (1.0.${{ github.run_number }})
        run: |
          GRADLE_FILE=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" "$GRADLE_FILE"
          sed -i "s/versionName .*/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE_FILE"
          grep -E "versionCode|versionName" "$GRADLE_FILE"

      - name: APK derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Release oluştur ve APK'yı ekle
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
